name: audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignored advisories — review on every Tauri / dependency bump.
      #
      # RUSTSEC-2026-0097 — `rand` 0.7.3 unsoundness via
      # `tauri-utils → kuchikiki → selectors → phf_codegen → phf_generator → rand 0.7.3`.
      # Build-time-only path (kuchikiki is part of tauri-utils' codegen
      # for HTML rewriting) so the unsound `rand::rng()` pattern can't
      # be triggered at runtime by user input. Stays ignored until
      # tauri-utils ships a kuchikiki bump.
      - run: cargo audit --deny warnings --ignore RUSTSEC-2026-0097

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  bun-audit:
    name: bun audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun audit --prod
        continue-on-error: true
