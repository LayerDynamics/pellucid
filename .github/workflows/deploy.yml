name: deploy

# Pre-deploy validation gate for the two Railway services
# (`pellucid-edge`, `pellucid-relay`). Runs on every push to `main`
# and can be triggered manually.
#
# Pipeline:
#   1. validate — fmt + clippy + full cargo nextest. Gates everything.
#   2. build-images — matrix dry-run of the two production Dockerfiles
#      under `deploy/railway/{edge,relay}/Dockerfile`. Catches
#      Dockerfile bitrot before Railway sees it.
#   3. smoke-deployed — polls the two live URLs after Railway finishes
#      its own auto-deploy, so a green workflow run means: the code
#      validated AND the production endpoints are 200-healthy.
#
# Railway does the actual deploy via its GitHub integration on each
# service (configured per-service in the dashboard: Source → Repo →
# LayerDynamics/pellucid + railwayConfigFile pointing at the matching
# `deploy/railway/{edge,relay}/railway.toml`). No `RAILWAY_TOKEN_*`
# secrets are required by this workflow — the deploy is driven from
# the Railway side, not from GitHub Actions.
#
# Repository variables (Settings → Secrets and variables → Variables):
#   PELLUCID_EDGE_PUBLIC_HOST   — e.g. `pellucid.world`
#   PELLUCID_RELAY_PUBLIC_HOST  — e.g. `pellucid.wtf`
# Both are used by the smoke-deployed job to find the post-deploy
# healthcheck URL. Already populated for this repo.
#
# Per-service runtime env vars (CLERK_*, RELAY_SHARED_SECRET, OPENSKY_*,
# AIS_API_KEY, UPSTASH_REDIS_REST_*, HF_TOKEN, GROQ_API_KEY,
# AVIATIONSTACK_API_KEY, CONVEX_DEPLOY_KEY, …) are configured in the
# Railway dashboard. See deploy/railway/{edge,relay}/railway.toml for
# the canonical list.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_image_build:
        description: "Skip the docker image dry-run build (faster, riskier)"
        type: boolean
        default: false
      skip_smoke:
        description: "Skip the post-deploy /healthz + /health probe"
        type: boolean
        default: false

# Serialise per-branch so two pushes back-to-back don't smoke-test
# each other's in-flight Railway rollouts. `cancel-in-progress: false`
# so we don't abandon a partly-completed validation.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate (fmt + clippy + nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install Tauri Linux deps
        # Workspace tests pull in pellucid-tauri which links against
        # webkit2gtk. Without these system libs the workspace fails to
        # link on ubuntu-latest.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - run: bun install --frozen-lockfile
      # `tauri::generate_context!()` panics during proc-macro
      # expansion if `frontendDist` doesn't exist on disk
      # (tauri-codegen 2.x src/context.rs:189). With
      # `custom-protocol` enabled by default on pellucid-tauri,
      # both `cargo clippy --workspace --all-targets` and
      # `cargo nextest --all-targets` below trigger that codegen
      # path, so the webview bundle has to exist before they run.
      - run: bun run --filter=@pellucid/webview build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Excluding pellucid-telegram from the test build because its
      # `grammers-client → libsql → libsql-ffi` link path collides with
      # the workspace's `sqlx → libsqlite3-sys` (both vendor sqlite3.c
      # and define the same exported symbols). Same workaround used in
      # `test-linux-app.yml` and `coverage.yml`. The telegram crate's
      # own unit tests still run via that crate's own `cargo test -p`
      # invocation; they just can't be linked into the workspace test
      # binary. Lifted when the session backend moves off libsql.
      - run: cargo nextest run --workspace --exclude pellucid-telegram --all-targets

  build-images:
    name: build ${{ matrix.image }} image (dry-run)
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.skip_image_build != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: pellucid-edge
            dockerfile: deploy/railway/edge/Dockerfile
          - image: pellucid-relay
            dockerfile: deploy/railway/relay/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.image }}
        # `load: false`, `push: false` — we only confirm the Dockerfile
        # builds end-to-end on the actual repo state. Railway runs the
        # real publish from its own builder.
        #
        # No cache configured here on purpose: the GHA cache backend
        # hits a documented eviction race ("failed to copy: cache entry
        # no longer exists") on multi-image workflows, and the dry-run
        # has no GHCR push target to write a registry cache to. Railway
        # does its own cached build, so a from-scratch validation here
        # is the conservative choice. If this job becomes too slow to
        # tolerate, switch to `type=registry` after pushing the build
        # image to GHCR (mirror docker-publish.yml's setup).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          tags: pellucid/${{ matrix.image }}:ci-${{ github.sha }}

  smoke-deployed:
    name: smoke ${{ matrix.image }} live healthcheck
    needs: [validate, build-images]
    # Skip when the operator opted out, AND require validate success
    # AND require build-images to either succeed or have been skipped
    # (skip_image_build=true). `always()` is the documented pattern
    # for `if:` blocks that need to inspect `needs.*.result`.
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.skip_smoke != true)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pellucid-edge
            host_var: PELLUCID_EDGE_PUBLIC_HOST
            path: /healthz
          - image: pellucid-relay
            host_var: PELLUCID_RELAY_PUBLIC_HOST
            path: /health
    steps:
      # Railway's GitHub-integration deploy starts on the same push
      # event but runs out-of-band. This job waits up to ~10 min for
      # the new deploy to swap in by polling the public host. We don't
      # fail the workflow if the host var is missing — that's just a
      # signal to skip the smoke step (the workflow's other jobs still
      # capture the validate + image-build evidence).
      - name: skip when host var unset
        id: hostcheck
        run: |
          host="${{ vars[matrix.host_var] }}"
          if [ -z "$host" ]; then
            echo "::warning::${{ matrix.host_var }} not set — skipping smoke probe"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "host=${host}" >> "$GITHUB_OUTPUT"
          fi
      - name: probe https://<host>${{ matrix.path }} until 200
        if: steps.hostcheck.outputs.skip != '1'
        run: |
          set -eu
          host="${{ steps.hostcheck.outputs.host }}"
          path="${{ matrix.path }}"
          # 60 attempts × 10 s = 10 min ceiling. Railway's average
          # build for these crates lands in 4–7 min; the extra slack
          # absorbs queueing on the Railway builder.
          for i in $(seq 1 60); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${host}${path}" || echo 000)
            echo "[$i/60] https://${host}${path} -> ${code}"
            if [ "$code" = "200" ]; then
              echo "${{ matrix.image }} healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${{ matrix.image }} ${path} did not return 200 within 10 minutes; check Railway dashboard"
          exit 1
