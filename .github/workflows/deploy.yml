name: deploy

# Deploys the two Railway services (`pellucid-edge`, `pellucid-relay`)
# from the repo root. The workflow runs on every push to `main` and
# can be triggered manually with optional per-service skips.
#
# Pipeline:
#   1. validate — fmt + clippy + full cargo nextest. Gates everything.
#   2. build-images — matrix build of the two production Dockerfiles
#      under `deploy/railway/{edge,relay}/Dockerfile`. Catches Dockerfile
#      bitrot before we ship anything to Railway.
#   3. deploy-edge / deploy-relay — `railway up --service <name>` against
#      the `pellucid` Railway project. Each service uses its own
#      project-scoped token stored as a repo secret.
#
# Required repository secrets (one Railway project token per service —
# the dashboard issues these under Project → Settings → Tokens):
#   RAILWAY_TOKEN_EDGE   — token authorized for the pellucid-edge service
#   RAILWAY_TOKEN_RELAY  — token authorized for the pellucid-relay service
#
# Per-service env vars must already be configured in the Railway
# dashboard (CLERK_*, RELAY_SHARED_SECRET, OPENSKY_*, AIS_API_KEY,
# UPSTASH_REDIS_REST_*, HF_TOKEN, GROQ_API_KEY, AVIATIONSTACK_API_KEY,
# CONVEX_DEPLOY_KEY, …). See deploy/railway/{edge,relay}/railway.toml
# for the canonical list.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_edge:
        description: "Deploy pellucid-edge"
        type: boolean
        default: true
      deploy_relay:
        description: "Deploy pellucid-relay"
        type: boolean
        default: true
      skip_image_build:
        description: "Skip the docker image dry-run build (faster, riskier)"
        type: boolean
        default: false

# Serialise deploys to the same env so two pushes back-to-back don't
# step on each other on Railway. `cancel-in-progress: false` because we
# don't want to abandon an already-running deploy mid-flight.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: validate (fmt + clippy + nextest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install Tauri Linux deps
        # Workspace tests pull in pellucid-tauri which links against
        # webkit2gtk. Without these system libs the workspace fails to
        # link on ubuntu-latest.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo nextest run --workspace --all-targets

  build-images:
    name: build ${{ matrix.image }} image (dry-run)
    needs: validate
    if: github.event_name != 'workflow_dispatch' || inputs.skip_image_build != true
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: pellucid-edge
            dockerfile: deploy/railway/edge/Dockerfile
          - image: pellucid-relay
            dockerfile: deploy/railway/relay/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build ${{ matrix.image }}
        # `load: false`, `push: false` — we only confirm the Dockerfile
        # builds end-to-end on the actual repo state. The Railway build
        # step does the real publish from its own builder.
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          load: false
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.image }}
          tags: pellucid/${{ matrix.image }}:ci-${{ github.sha }}

  deploy-edge:
    name: deploy pellucid-edge
    needs: [validate, build-images]
    # Run the deploy when:
    #   - push to main (always), OR
    #   - workflow_dispatch with deploy_edge == true
    # Also gate on validate succeeding; build-images may have been
    # skipped by inputs.skip_image_build, in which case `needs` still
    # resolves because skipped is treated as success unless we use
    # `result == 'failure'`. We assert success-or-skipped explicitly.
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_edge == true)
    runs-on: ubuntu-latest
    environment:
      name: railway-edge
      url: https://${{ vars.PELLUCID_EDGE_PUBLIC_HOST }}/healthz
    concurrency:
      group: deploy-edge
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_EDGE }}
    steps:
      - uses: actions/checkout@v4
      - name: install railway cli
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: assert railway token present
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN_EDGE secret is missing"
            exit 1
          fi
          railway --version
      - name: deploy pellucid-edge
        # `--service` selects the service inside the project the token
        # is scoped to; `--detach` returns once the build is queued
        # rather than tailing logs (the workflow page links to Railway
        # for the live build log). `--ci` prevents any TTY prompts.
        run: railway up --service pellucid-edge --ci --detach
      - name: smoke /healthz
        # Railway's deploy is asynchronous — give the platform up to
        # ~5 minutes to swap the active deployment, then poll /healthz.
        # We don't fail the workflow on a healthcheck miss because
        # Railway's own healthcheckPath gate already blocks an unhealthy
        # deploy from going live; this is best-effort visibility.
        if: vars.PELLUCID_EDGE_PUBLIC_HOST != ''
        continue-on-error: true
        run: |
          set -eu
          host="${{ vars.PELLUCID_EDGE_PUBLIC_HOST }}"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${host}/healthz" || echo 000)
            echo "[$i/30] https://${host}/healthz -> ${code}"
            if [ "$code" = "200" ]; then
              echo "edge healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::edge /healthz did not return 200 within 5 minutes; check Railway dashboard"

  deploy-relay:
    name: deploy pellucid-relay
    needs: [validate, build-images]
    if: |
      always() &&
      needs.validate.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (github.event_name != 'workflow_dispatch' || inputs.deploy_relay == true)
    runs-on: ubuntu-latest
    environment:
      name: railway-relay
      url: https://${{ vars.PELLUCID_RELAY_PUBLIC_HOST }}/health
    concurrency:
      group: deploy-relay
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_RELAY }}
    steps:
      - uses: actions/checkout@v4
      - name: install railway cli
        run: |
          curl -fsSL https://railway.com/install.sh | sh
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"
      - name: assert railway token present
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN_RELAY secret is missing"
            exit 1
          fi
          railway --version
      - name: deploy pellucid-relay
        run: railway up --service pellucid-relay --ci --detach
      - name: smoke /health
        if: vars.PELLUCID_RELAY_PUBLIC_HOST != ''
        continue-on-error: true
        run: |
          set -eu
          host="${{ vars.PELLUCID_RELAY_PUBLIC_HOST }}"
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://${host}/health" || echo 000)
            echo "[$i/30] https://${host}/health -> ${code}"
            if [ "$code" = "200" ]; then
              echo "relay healthy"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::relay /health did not return 200 within 5 minutes; check Railway dashboard"
