name: docker-publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    name: build + push ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pellucid-edge
            dockerfile: deploy/railway/edge/Dockerfile
            crate: pellucid-edge-bin
          - image: pellucid-relay
            dockerfile: deploy/railway/relay/Dockerfile
            crate: pellucid-relay-bin
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Registry-backed cache (cache lives alongside the image at
          # GHCR under the `:buildcache` tag). Replaces the previous
          # `type=gha` cache, which hit the documented eviction race
          # `failed to solve: failed to copy: cache entry no longer
          # exists` — the GHA cache backend's index was restored but
          # the underlying blob had already been evicted by the time
          # the build ran (GHA caches are evicted after 7 days of
          # inactivity AND when a repo's total cache exceeds 10 GB,
          # which the multi-arch + multi-image build trips). The
          # registry backend has no such eviction policy.
          # `mode=max` writes every intermediate layer, not just the
          # final manifest — important here because Cargo + workspace
          # crates produce many heavy intermediates that benefit from
          # cache hits across PRs. `ignore-error=true` on cache-to
          # prevents a transient registry-write failure from killing
          # an otherwise-good build (the next build just rebuilds the
          # cache).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max,ignore-error=true
