name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: install Tauri Linux deps
        # pellucid-tauri pulls in glib-sys / webkit2gtk-sys; clippy
        # checks them too, so the system pkgs must be present.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - run: bun install --frozen-lockfile
      # `tauri::generate_context!()` panics during proc-macro expansion
      # if `frontendDist` doesn't exist on disk
      # (tauri-codegen 2.x src/context.rs:189). With the
      # `custom-protocol` feature now enabled by default on
      # pellucid-tauri, `cargo clippy --workspace --all-targets`
      # triggers that codegen path, so the webview bundle has to
      # exist before clippy runs.
      - run: bun run --filter=@pellucid/webview build
      - run: cargo clippy --workspace --all-targets -- -D warnings

  tools:
    name: tools (cache-keys + csp + edge-imports + version-sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run tools/check-cache-keys.ts
      - run: bun run tools/check-csp.ts
      - run: bun run tools/check-edge-imports.ts
      - run: bun run tools/version-sync.ts

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color
