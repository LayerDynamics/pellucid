name: test-linux-app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rust-tests:
    name: cargo nextest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: install Tauri Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      # Excluding pellucid-telegram: it links `grammers-client → libsql →
      # libsql-ffi (vendored sqlite3.c)` while the rest of the workspace
      # links `sqlx → libsqlite3-sys (also vendored sqlite3.c)`. Both
      # vendor the same symbols so unifying them in one test binary
      # produces `duplicate symbol: sqlite3_*` link errors. The
      # workaround is documented in `crates/pellucid-relay-bin/Cargo.toml`
      # — telegram is opt-in there for the same reason. Exclusion can
      # be lifted once the session backend moves off libsql.
      - run: cargo nextest run --workspace --exclude pellucid-telegram --all-targets

  bun-tests:
    name: bun test (webview + convex + tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --filter='*' test

  e2e-web:
    name: playwright web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-desktop:
    name: webdriverio desktop (tauri-driver)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install Tauri Linux deps + webkit2gtk-driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked
      - run: bun install --frozen-lockfile
      - run: bun run --filter=@pellucid/webview build
      - run: cargo build --release -p pellucid-tauri
      # Spawn tauri-driver in the background — the wdio.conf.ts expects
      # it already listening at 127.0.0.1:4444. Without this step every
      # spec fails with ECONNREFUSED. The `&` backgrounds the process;
      # the runner kills it when the job ends.
      # Sanity-check the binary's webkit2gtk linkage before spawning the
      # driver. Tauri 2 must be linked against `libwebkit2gtk-4.1.so`;
      # if the runner ships only 4.0 (older Ubuntu images) the binary
      # would launch but the webview never opens — and the wdio session
      # times out with no useful error. Failing loud here saves a 30+
      # minute red-herring debug session later.
      - name: verify webkit2gtk-4.1 linkage
        run: |
          set -eu
          bin=${{ github.workspace }}/target/release/pellucid-tauri
          ldd "$bin" | grep -E "libwebkit2gtk" || true
          if ! ldd "$bin" | grep -q "libwebkit2gtk-4.1.so"; then
            echo "::error::pellucid-tauri is not linked against libwebkit2gtk-4.1 — Tauri 2 requires it"
            exit 1
          fi
      - name: start tauri-driver
        run: |
          # `RUST_LOG=trace` on tauri-driver surfaces the WebKitWebDriver
          # subprocess interaction so a stuck session-create dumps useful
          # diagnostics into `tauri-driver.log` instead of staying silent
          # (per upstream Tauri docs' debugging recommendation).
          RUST_LOG=trace xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            tauri-driver --port 4444 \
            > "${RUNNER_TEMP:-/tmp}/tauri-driver.log" 2>&1 &
          echo "TAURI_DRIVER_PID=$!" >> "$GITHUB_ENV"
          # Wait until the driver is accepting TCP connections (max 30s).
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -m 1 http://127.0.0.1:4444/status; then
              echo "tauri-driver is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::tauri-driver failed to start within 30s"
          cat "${RUNNER_TEMP:-/tmp}/tauri-driver.log" || true
          exit 1
      # `-a` (alias `--auto-servernum`, kept explicit here so a future
      # reader doesn't strip it) prevents collision when wdio retries
      # session-create and xvfb gets re-invoked. `--server-args` matches
      # the display geometry the wdio.conf.ts viewport assertions assume.
      - run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            bun run e2e:desktop
        env:
          PELLUCID_TAURI_BIN: ${{ github.workspace }}/target/release/pellucid-tauri
      - name: stop tauri-driver
        if: always()
        run: |
          if [ -n "${TAURI_DRIVER_PID:-}" ]; then
            kill "$TAURI_DRIVER_PID" 2>/dev/null || true
          fi
          # Surface driver logs even on success — tauri-driver is noisy
          # but its log is the only window into mid-test browser crashes.
          if [ -f "${RUNNER_TEMP:-/tmp}/tauri-driver.log" ]; then
            echo "::group::tauri-driver log tail"
            tail -n 200 "${RUNNER_TEMP:-/tmp}/tauri-driver.log"
            echo "::endgroup::"
          fi
