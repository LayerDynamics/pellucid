name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: typecheck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - name: install Tauri Linux deps
        # pellucid-tauri's transitive glib-sys / webkit2gtk-sys deps need
        # these system pkgs even for `cargo check` (build scripts run).
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev
      - run: bun install --frozen-lockfile
      # See lint.yml for why this is required: with
      # `custom-protocol` enabled, tauri-codegen panics during
      # proc-macro expansion if `webview/dist` doesn't exist, even
      # for a non-link `cargo check`.
      - run: bun run --filter=@pellucid/webview build
      - run: cargo check --workspace --all-targets --locked

  ts:
    name: bun typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run --filter='*' typecheck
