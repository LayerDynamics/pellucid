[workspace]
resolver = "2"
members = [
    "crates/pellucid-core",
    "crates/pellucid-db",
    "crates/pellucid-cache",
    "crates/pellucid-streams",
    "crates/pellucid-seeders",
    "crates/pellucid-gateway",
    "crates/pellucid-handlers",
    "crates/pellucid-auth",
    "crates/pellucid-ml",
    "crates/pellucid-correlation",
    "crates/pellucid-workers",
    "crates/pellucid-codegen",
    "crates/pellucid-tauri",
    "crates/pellucid-sidecar-bin",
    "crates/pellucid-edge-bin",
    "crates/pellucid-relay-bin",
]

[workspace.dependencies]
# async runtime + HTTP
tokio = { version = "1.44", features = ["full"] }
axum = { version = "0.8", features = ["macros", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "compression-full", "trace", "fs", "timeout", "limit", "set-header"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
hyper = { version = "1.6", features = ["full"] }

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "json", "time", "uuid"] }

# serialization + utilities
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1.10", features = ["v4", "v7", "serde"] }
phf = { version = "0.11", features = ["macros"] }
async-trait = "0.1"
url = "2.5"
feed-rs = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
bytes = "1.8"
futures = "0.3"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1.20"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# auth + crypto
jsonwebtoken = "9"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"

# desktop secrets
keyring = { version = "3", default-features = false, features = ["apple-native", "linux-native", "windows-native", "sync-secret-service"] }
getrandom = { version = "0.2", features = ["std"] }

# test-only dependencies (declared once so per-crate dev-dependencies stay slim)
wiremock = "0.6"
proptest = "1.5"
tempfile = "3.13"
rsa = "0.9"
base64 = "0.22"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/layerdynamics/pellucid"
authors = ["Pellucid contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1
debug = true
