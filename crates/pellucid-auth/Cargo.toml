[package]
name = "pellucid-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Clerk JWT verify, entitlement check, HMAC sign/verify"

[lints]
workspace = true

[features]
# Exposes `pellucid_auth::test_keys` for integration tests in this
# crate's `tests/` dir (and downstream crates) that need to sign
# tokens against the same fixture key the unit suite uses.
test-keys = ["dep:rsa", "dep:base64"]

[dependencies]
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
parking_lot = { workspace = true }
phf = { workspace = true }
sqlx = { workspace = true }
pellucid-gateway = { path = "../pellucid-gateway" }
pellucid-core = { path = "../pellucid-core" }
pellucid-db = { path = "../pellucid-db" }
rsa = { workspace = true, features = ["sha2"], optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true }
rsa = { workspace = true, features = ["sha2"] }
base64 = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
pellucid-auth = { path = ".", features = ["test-keys"] }
