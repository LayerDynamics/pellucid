[package]
name = "pellucid-edge-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "hosted public API binary — gateway + handlers on :8080"

[lints]
workspace = true

[lib]
name = "pellucid_edge_bin"
path = "src/lib.rs"

[[bin]]
name = "pellucid-edge-bin"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-db = { path = "../pellucid-db" }
pellucid-cache = { path = "../pellucid-cache" }
pellucid-gateway = { path = "../pellucid-gateway" }
pellucid-handlers = { path = "../pellucid-handlers" }
# `default-features = false` drops the `telegram` feature, which
# pulls grammers-client → libsql → bundled SQLite. sqlx already
# bundles SQLite via libsqlite3-sys; linking both into the same
# binary fails with "duplicate symbol: sqlite3_*" on rust-lld.
# Edge only uses aviationstack from streams; the relay (which
# actually owns the Telegram task) keeps the default features.
pellucid-streams = { path = "../pellucid-streams", default-features = false }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
