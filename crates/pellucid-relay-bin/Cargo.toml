[package]
name = "pellucid-relay-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "stream relay binary — AIS / OpenSky / RSS / OREF, seed scheduler, /health"

[lints]
workspace = true

[lib]
name = "pellucid_relay_bin"
path = "src/lib.rs"

[[bin]]
name = "pellucid-relay-bin"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
rustls = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-db = { path = "../pellucid-db" }
pellucid-cache = { path = "../pellucid-cache" }
pellucid-streams = { path = "../pellucid-streams" }
pellucid-telegram = { path = "../pellucid-telegram", optional = true }
pellucid-seeders = { path = "../pellucid-seeders" }

[features]
# `telegram` is **off by default**. The MTProto client links
# `grammers-client → libsql → libsql-ffi (vendored SQLite)` while the
# relay also links `sqlx → libsqlite3-sys (vendored SQLite)`; both
# vendor `sqlite3.c` and collide at link time with `multiple
# definition of sqlite3_*`. Until the session backend is moved off
# libsql, telegram is opt-in. Off → relay deploys cleanly with no
# duplicate-symbol error.
default = []
telegram = ["dep:pellucid-telegram"]

[dev-dependencies]
tokio = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true }
wiremock = { workspace = true }
tempfile = { workspace = true }
