[package]
name = "pellucid-seeders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "seeder modules + scheduler + atomic_publish"

[lints]
workspace = true

[dependencies]
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
uuid = { workspace = true }
metrics = { workspace = true }
parking_lot = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-db = { path = "../pellucid-db" }
pellucid-cache = { path = "../pellucid-cache" }

[dev-dependencies]
tokio = { workspace = true }
wiremock = { workspace = true }
reqwest = { workspace = true }
# regression_h3 uses pellucid_streams::OpenSkyConfig. The streams crate
# regular-deps `pellucid-seeders` (T4.5.0 added that for atomic_publish);
# Cargo allows the inverse dev-dep because dev-deps are not part of the
# lib build graph.
pellucid-streams = { path = "../pellucid-streams" }
