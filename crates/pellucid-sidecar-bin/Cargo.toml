[package]
name = "pellucid-sidecar-bin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
description = "in-process desktop API binary — Axum sidecar with bearer auth"

[lints]
workspace = true

[lib]
name = "pellucid_sidecar"
path = "src/lib.rs"

[[bin]]
name = "pellucid-sidecar-bin"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-cache = { path = "../pellucid-cache" }
pellucid-gateway = { path = "../pellucid-gateway" }
pellucid-handlers = { path = "../pellucid-handlers" }
pellucid-ml = { path = "../pellucid-ml" }
pellucid-streams = { path = "../pellucid-streams" }
pellucid-telegram = { path = "../pellucid-telegram", optional = true }
pellucid-db = { path = "../pellucid-db" }

[features]
# `telegram` is **off by default**. `pellucid-telegram` pulls
# `grammers → libsql → libsql-ffi` (vendored SQLite) which collides
# with sqlx's `libsqlite3-sys` (also vendored) at link time. Turning
# the feature on re-enables the MTProto session IPC handlers
# (`TELEGRAM_SESSION_UPDATED` / `TELEGRAM_SESSION_CLEARED`) and the
# in-memory `IpcSessionStore`.
default = []
telegram = ["dep:pellucid-telegram"]

[dev-dependencies]
reqwest = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
