[package]
name = "pellucid-streams"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "AIS, OpenSky, RSS, Telegram, OREF, aviationstack clients"

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
url = { workspace = true }
feed-rs = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
mini-moka = { workspace = true }
md-5 = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
metrics = { workspace = true }
grammers-client = { workspace = true, optional = true }
grammers-session = { workspace = true, optional = true }
grammers-tl-types = { workspace = true, optional = true }
chrono = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-cache = { path = "../pellucid-cache" }
pellucid-db = { path = "../pellucid-db" }
pellucid-handlers = { path = "../pellucid-handlers" }
# T4.5.0 — telegram::run uses atomic_publish (lock + staging + canonical
# + seed_meta) the same way every other seeder does. The dev-dep direction
# (seeders -> streams, only for tests) was removed when seed_telegram_intel_min
# was deleted, so no Cargo cycle.
pellucid-seeders = { path = "../pellucid-seeders" }

[features]
# Default ships the full surface — desktop sidecar + relay both
# enable telegram. The hosted edge-bin disables this feature
# (see `crates/pellucid-edge-bin/Cargo.toml`) so the gateway +
# RPC handlers don't drag in `grammers-client → libsql →
# bundled SQLite`, which collides at link time with sqlx's
# `libsqlite3-sys` (also bundled).
default = ["telegram"]
# Enables the MTProto Telegram client (`pellucid_streams::telegram`)
# and its dependency closure (grammers-client/session/tl-types).
telegram = [
    "dep:grammers-client",
    "dep:grammers-session",
    "dep:grammers-tl-types",
]

[dev-dependencies]
wiremock = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }
