[package]
name = "pellucid-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tauri 2 host (window, tray, IPC, vault, updater)"

[lints]
workspace = true

[lib]
name = "pellucid_tauri"
path = "src/lib.rs"

[[bin]]
name = "pellucid-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }
thiserror = { workspace = true }
keyring = { workspace = true }
async-trait = { workspace = true }
getrandom = { workspace = true }
base64 = { workspace = true }
pellucid-core = { path = "../pellucid-core" }
pellucid-ml = { path = "../pellucid-ml" }
pellucid-streams = { path = "../pellucid-streams" }
pellucid-telegram = { path = "../pellucid-telegram", optional = true }

[features]
# `telegram` is **off by default**; the dep brings `grammers → libsql`
# (vendored SQLite) which collides with sqlx's `libsqlite3-sys` (also
# vendored) at link time inside any binary that links both. Turning
# the feature on re-enables the desktop host's MTProto login flow
# (`telegram_login`) and the IPC commands that drive it.
default = []
telegram = ["dep:pellucid-telegram"]

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tempfile = { workspace = true }
reqwest = { workspace = true }
pellucid-sidecar-bin = { path = "../pellucid-sidecar-bin" }
