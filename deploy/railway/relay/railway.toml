# Railway service config — pellucid-relay
#
# Point the Railway service at this file via the dashboard
# "Config-as-code Path" setting:
#   deploy/railway/relay/railway.toml
#
# ## Service variables (set in Railway dashboard before deploy)
#
# ### Required — application
#   RELAY_SHARED_SECRET     gates the /opensky/* proxy. The C1
#                           startup gate exits 78 if this is
#                           missing while RAILWAY_PROJECT_ID is
#                           present (always true on Railway).
#                           MUST equal the edge service's value.
#   OPENSKY_CLIENT_ID       OAuth2 client id for OpenSky.
#   OPENSKY_CLIENT_SECRET   OAuth2 client secret for OpenSky.
#   AIS_API_KEY             aisstream.io subscribe key.
#
# ### Required — Litestream replica (Digital Ocean Spaces)
# Continuous SQLite replication to Digital Ocean Spaces per
# SPEC-001 §6 + §17.5. Without these set, the relay still boots
# but the SQLite database is local-Volume-only — losing the
# Volume (region failover, accidental Volume detach) loses every
# seeded envelope.
#
#   LITESTREAM_REPLICA_URL   Full S3-protocol replica URL with the
#                            non-AWS endpoint encoded as a query
#                            string. Use a DIFFERENT bucket path
#                            from the edge service so the two
#                            services' WAL frames don't collide.
#                            For Digital Ocean Spaces in Atlanta:
#                              s3://allbuckets-1778293858293/pellucid-relay?endpoint=https://atl1.digitaloceanspaces.com&region=atl1&force-path-style=true
#                            Empty value → Litestream OFF (relay
#                            runs without replication; acceptable
#                            for staging only).
#   LITESTREAM_ACCESS_KEY_ID Digital Ocean Spaces access key id.
#                            Litestream reads this automatically.
#   LITESTREAM_SECRET_ACCESS_KEY  matching Digital Ocean Spaces
#                                 secret key.
#
# ### Optional — Litestream tuning
#   LITESTREAM_SYNC_INTERVAL      default `1s`
#   LITESTREAM_RETENTION          default `24h`
#   LITESTREAM_SNAPSHOT_INTERVAL  default `1h`
#
# ### Optional — application (with defaults set under [deploy.envs] below)
#   PELLUCID_DB_URL          default points at the mounted Volume.
#   RUST_LOG                 default `info,...`.
#   PELLUCID_PROD            default `true`. Reinforces the C1 gate's
#                            production assertion.
#
# ## Volume
#
# Attach a Railway Volume to this service in the dashboard with
# mount path `/data`. The default `PELLUCID_DB_URL` below stores
# the SQLite database there so it survives deploys. Litestream
# replication still happens to the Digital Ocean Spaces bucket;
# the Volume is the local cache + WAL working set, NOT the
# durable copy.
#
# ## Port
#
# Railway sets `PORT` at runtime. `pellucid-relay-bin` reads it
# automatically (see `resolve_listen_addr_from_env`), so we do
# NOT pin `PELLUCID_RELAY_LISTEN_ADDR` here — let Railway pick
# the public port and the binary will bind `0.0.0.0:$PORT`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/railway/relay/Dockerfile"

[deploy]
# `tini` is the entrypoint; the entrypoint script wraps the
# binary in `litestream replicate -exec`. The relay's
# `/health` route lives at the gateway-merged router and answers
# regardless of Litestream state.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
numReplicas = 1
# Railway honours SIGTERM with the configured grace period.
# 10s matches the relay's `Config::shutdown_grace` plus a
# safety margin for the AIS WebSocket close handshake.
sleepApplication = false

[deploy.envs]
# Default DB path — assumes the dashboard attaches a Volume at /data.
PELLUCID_DB_URL = "sqlite:///data/pellucid-relay.db?mode=rwc"
# Reinforce the prod assertion in the C1 gate. Railway's
# `RAILWAY_PROJECT_ID` already trips production detection, so
# this is belt-and-braces.
PELLUCID_PROD = "true"
RUST_LOG = "info,pellucid_relay_bin=info,pellucid_streams=info"
